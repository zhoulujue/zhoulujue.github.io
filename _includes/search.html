<div id="search-modal" class="search-modal" style="display: none;" role="dialog" aria-modal="true" aria-labelledby="search-input">
  <div class="search-modal-backdrop" id="search-backdrop"></div>
  <div class="search-modal-content">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search-input" placeholder="搜索文章标题、关键词 (支持 ↑ ↓ 导航)..." autocomplete="off" />
      <button type="button" id="search-close" aria-label="关闭搜索弹窗">&times;</button>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>
</div>

<script>
(function() {
  var searchModal = document.getElementById('search-modal');
  var searchToggle = document.getElementById('search-toggle');
  var searchClose = document.getElementById('search-close');
  var searchBackdrop = document.getElementById('search-backdrop');
  var searchInput = document.getElementById('search-input');
  var searchResults = document.getElementById('search-results');
  var searchData = null;
  var selectedIndex = -1;
  var debounceTimer = null;

  function loadSearchData() {
    if (searchData) return Promise.resolve(searchData);
    return fetch('{{ site.baseurl }}/search.json')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        searchData = data;
        return data;
      }).catch(function(err) {
        console.error('Failed to load search.json: ', err);
        return [];
      });
  }

  function openSearch(e) {
    if (e) e.preventDefault();
    searchModal.style.display = 'flex';
    document.body.style.overflow = 'hidden';
    loadSearchData();
    setTimeout(function() { searchInput.focus(); }, 80);
  }

  function closeSearch() {
    searchModal.style.display = 'none';
    document.body.style.overflow = '';
    searchInput.value = '';
    searchResults.innerHTML = '';
    selectedIndex = -1;
  }

  if (searchToggle) {
    searchToggle.addEventListener('click', openSearch);
  }

  if (searchClose) searchClose.addEventListener('click', closeSearch);
  if (searchBackdrop) searchBackdrop.addEventListener('click', closeSearch);

  // Global keyboard shortcuts
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && searchModal.style.display === 'flex') {
      closeSearch();
    }
    // Shortcut Ctrl+K or Cmd+K
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (searchModal.style.display === 'flex') {
        closeSearch();
      } else {
        openSearch();
      }
    }
  });

  // Modal navigation shortcuts (Arrow keys & Enter)
  searchInput.addEventListener('keydown', function(e) {
    var items = searchResults.querySelectorAll('.search-item a');
    if (!items.length) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIndex = (selectedIndex + 1) % items.length;
      updateSelection(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIndex = (selectedIndex - 1 + items.length) % items.length;
      updateSelection(items);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (selectedIndex >= 0 && selectedIndex < items.length) {
        items[selectedIndex].click();
      } else if (items.length > 0) {
        items[0].click();
      }
    }
  });

  function updateSelection(items) {
    items.forEach(function(item, idx) {
      if (idx === selectedIndex) {
        item.classList.add('selected');
        item.scrollIntoView({ block: 'nearest' });
      } else {
        item.classList.remove('selected');
      }
    });
  }

  // Debounced input search
  searchInput.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(performSearch, 150);
  });

  function performSearch() {
    var query = searchInput.value.trim().toLowerCase();
    selectedIndex = -1;
    if (!query) {
      searchResults.innerHTML = '';
      return;
    }

    loadSearchData().then(function(posts) {
      var matches = posts.filter(function(post) {
        return (post.title && post.title.toLowerCase().indexOf(query) !== -1) ||
               (post.content && post.content.toLowerCase().indexOf(query) !== -1);
      });

      if (matches.length === 0) {
        searchResults.innerHTML = '<div class="search-empty">未找到与 “' + escapeHtml(query) + '” 相关的文章</div>';
        return;
      }

      var html = '<ul class="search-results-list">';
      matches.slice(0, 10).forEach(function(post, index) {
        html += '<li class="search-item">' +
                '<a href="' + post.url + '">' +
                '<div class="search-item-title">' + highlight(post.title, query) + '</div>' +
                '<div class="search-item-date">' + escapeHtml(post.date) + '</div>' +
                '<div class="search-item-snippet">' + highlight(post.content, query) + '</div>' +
                '</a></li>';
      });
      html += '</ul>';
      searchResults.innerHTML = html;
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function highlight(text, query) {
    if (!text) return '';
    var escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var safeText = escapeHtml(text);
    var regex = new RegExp('(' + escapedQuery + ')', 'gi');
    return safeText.replace(regex, '<mark>$1</mark>');
  }
})();
</script>
